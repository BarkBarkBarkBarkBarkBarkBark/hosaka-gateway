<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hosaka Gateway</title>
  <link rel="stylesheet" href="/gateway.css">
  <script src="/gateway.js" defer></script>
</head>
<body>
  <a href="#main" class="skip">Skip to apps</a>
  <header><h1>Hosaka</h1><p>Your local applications</p></header>
  <main id="main">
    <form id="login">
      <label for="password">Gateway password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
      <button type="submit">Sign in</button>
    </form>
    <p id="status" role="status"></p>
    <nav id="apps" aria-label="Applications"></nav>
    <button id="logout" type="button" hidden>Sign out</button>
  </main>
</body>
</html>
